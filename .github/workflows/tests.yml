name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # oldest supported, plus the two the release is likely to be built on.
        # 3.8 is end-of-life and no longer provisioned reliably, so the README
        # claims 3.9+ and this is what actually proves it.
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        shell: pwsh
        run: python -m unittest discover -s tests -v
